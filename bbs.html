<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PaperClip BBS · 拨号上站的复古终端模拟器" />
  <meta name="theme-color" content="#050607" />
  <link rel="icon" type="image/jpeg" href="00.jpg" />
  <title>PaperClip BBS · 复古模式</title>
  <style>
    /* ---------- 复古像素字体：Fusion Pixel（OFL 开源，本地 fonts/ 目录）
       12px 网格点阵字库，含 latin 与简体中文字形；字号取 12 的整数倍
       （24px / 12px）保证像素锐利不失真 ---------- */
    @font-face {
      font-family: "Fusion Pixel";
      src: url("fonts/fusion-pixel-12px-monospaced-latin.ttf.woff2") format("woff2");
      font-display: swap;
      unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2500-257F, U+2580-259F, U+25A0-25FF;
    }
    @font-face {
      font-family: "Fusion Pixel";
      src: url("fonts/fusion-pixel-12px-monospaced-zh_hans.ttf.woff2") format("woff2");
      font-display: swap;
    }

    /* ---------- DOS 终端：纯黑屏幕 + 浅灰文字 + ANSI 亮色 ---------- */
    :root {
      --fg: #c9c9c9;            /* DOS 默认浅灰文字 */
      --fg-dim: #6e6e6e;        /* 暗灰 */
      --yellow: #ffe95c;        /* ANSI 亮黄（强调） */
      --cyan: #5ce0e0;          /* ANSI 亮青 */
      --err: #ff5555;           /* ANSI 亮红 */
      --bg: #000000;
      --dos-blue: #0000a8;      /* DOS 状态栏蓝 */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background:
        radial-gradient(ellipse at center, #0b0b0d 0%, var(--bg) 70%),
        var(--bg);
      color: var(--fg);
      font-family: "Fusion Pixel", "Consolas", "Courier New", monospace;
      overflow: hidden;
      padding: 22px;         /* 留出 CRT 显示器外壳边框 */
    }

    /* ---------- 屏幕外壳：曲面圆角 + 显示器边框 + 玻璃内阴影 ---------- */
    #crt {
      position: relative;
      height: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 22px 26px 26px;
      overflow: hidden;
      font-size: 12px;       /* 点阵字体原生尺寸：12px（中文站名除外） */
      border-radius: 20px;
      background: radial-gradient(ellipse at 50% 35%, rgba(255, 255, 255, 0.03), transparent 65%);
      /* 显示器塑料边框圈 + 玻璃曲面内阴影 */
      box-shadow:
        0 0 0 10px #16171c,
        0 0 0 12px #0b0c0f,
        0 22px 60px rgba(0, 0, 0, 0.85),
        inset 0 0 120px rgba(0, 0, 0, 0.9);
      cursor: text;
      display: flex;
      flex-direction: column;
    }

    /* ---------- CRT 玻璃层效果（自下而上：滚纹 → 反光 → 噪点 → 扫描线 → 暗角） ---------- */

    /* 滚动干扰纹：一条淡亮带缓缓从上往下扫过 */
    #band {
      position: absolute;
      left: 0;
      right: 0;
      top: -30%;
      height: 140px;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(255, 255, 255, 0.05) 45%,
        rgba(255, 255, 255, 0.02) 60%,
        transparent
      );
      animation: band-roll 8.5s linear infinite;
    }

    @keyframes band-roll {
      from { top: -25%; }
      to   { top: 115%; }
    }

    /* 玻璃反光：左上一团柔光 + 一道斜向高光 */
    #glare {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        radial-gradient(ellipse 55% 40% at 20% 6%, rgba(255, 255, 255, 0.075), transparent 60%),
        linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.03) 46%, transparent 55%);
    }

    /* 动态噪点：细颗粒雪花了 */
    #noise {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0.05;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      animation: noise-jitter 0.45s steps(4) infinite;
    }

    @keyframes noise-jitter {
      0%   { background-position: 0 0; }
      25%  { background-position: -34px 22px; }
      50%  { background-position: 22px -30px; }
      75%  { background-position: -18px -14px; }
      100% { background-position: 0 0; }
    }

    /* 扫描线 */
    #crt::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0 2px,
        rgba(0, 0, 0, 0.22) 2px 4px
      );
      z-index: 5;
    }

    /* 屏幕暗角 */
    #crt::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    /* 轻微闪烁（呼吸式亮度波动） */
    #screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: inherit;    /* 跟随 #crt 的 12px 点阵尺寸 */
      line-height: 1.7;
      /* 文字发光 + 轻微 RGB 色差（红/青错边），模拟荧光粉成像 */
      text-shadow:
        1px 0 0 rgba(255, 70, 70, 0.24),
        -1px 0 0 rgba(60, 220, 255, 0.24),
        0 0 4px rgba(230, 230, 230, 0.2);
      animation: flicker 4.2s infinite;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--fg-dim) transparent;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92%      { opacity: 1; }
      93%      { opacity: 0.86; }
      94%      { opacity: 1; }
      97%      { opacity: 0.93; }
      98%      { opacity: 1; }
    }

    #screen p { white-space: pre-wrap; word-break: break-all; min-height: 1.5em; }
    #screen a { color: var(--amber); text-decoration: underline; }

    .dim  { color: var(--fg-dim); text-shadow: none; }
    .amb  { color: var(--yellow); text-shadow: 0 0 6px rgba(255, 233, 92, 0.3); }
    .err  { color: var(--err); text-shadow: 0 0 6px rgba(255, 85, 85, 0.3); }
    .wht  { color: #ffffff; text-shadow: 0 0 4px rgba(255, 255, 255, 0.25); }
    .cyn  { color: var(--cyan); text-shadow: 0 0 6px rgba(92, 224, 224, 0.28); }

    /* ASCII 横幅：全角块状字符点阵，12px 原生尺寸保证像素锐利且等宽对齐 */
    #screen p.art {
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: 0;
      white-space: pre;
      overflow-x: auto;
    }

    /* ---------- 输入行：提示符 + 透明 input + 块状光标 ---------- */
    #input-row {
      display: none;
      align-items: baseline;
      gap: 0;
      padding: 4px 0 0;
      flex-shrink: 0;
    }

    #input-row.on { display: flex; }

    #prompt { white-space: pre; }

    /* 输入区：真实 input 透明叠加，镜像层负责显示文字与块状光标 */
    #input-wrap {
      position: relative;
      flex: 1;
      min-width: 80px;
      overflow: hidden;
    }

    #mirror {
      display: block;
      min-height: 1.5em;
      white-space: pre;
    }

    #mirror-inner {
      display: inline-block;
      white-space: pre;
    }

    /* 块状光标：跟随真实插入点，输入时自动重置闪烁 */
    #mirror .m-cur {
      display: inline-block;
      width: 0.62em;
      height: 1.1em;
      margin-right: 1px;
      background: var(--fg);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.35);
      animation: blink 1.06s steps(1) infinite;
      vertical-align: text-bottom;
    }

    /* 选中文字反色显示（选区功能） */
    #mirror .m-sel {
      background: var(--fg);
      color: #000;
      text-shadow: none;
    }

    #kb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: transparent;
      caret-color: transparent; /* 原生竖线隐藏，由镜像光标替代 */
      font: inherit;
      text-shadow: none;
    }

    /* 中文站名：大字号宽字距排印 */
    .cn {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.45em;
      color: var(--yellow);
      text-shadow: 0 0 8px rgba(255, 233, 92, 0.35);
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* ---------- 开机覆盖层：需要一次点击来解锁音频 ---------- */
    #power {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--bg);
      cursor: pointer;
      text-align: center;
      padding: 24px;
    }

    #power .pwr-icon {
      width: 74px;
      height: 74px;
      border: 2px solid var(--phos-dim);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      color: var(--phos-dim);
      transition: all 0.3s ease;
      box-shadow: 0 0 0 0 rgba(61, 255, 124, 0);
    }

    #power:hover .pwr-icon {
      color: var(--fg);
      border-color: var(--fg);
      box-shadow: 0 0 26px rgba(255, 255, 255, 0.25);
    }

    #power .pwr-txt { font-size: 12px; letter-spacing: 0.2em; }
    #power .pwr-sub { font-size: 12px; color: var(--fg-dim); letter-spacing: 0.1em; }

    /* 开机瞬间的电子束闪光 */
    #crt.booting #screen { animation: beam-on 0.55s ease-out, flicker 4.2s 0.55s infinite; }

    /* 关机：亮度骤增 → 电子束收缩成一条亮线 → 熄灭成一个点 */
    #crt.off {
      pointer-events: none;
      animation: beam-off 0.6s ease-in forwards;
    }

    @keyframes beam-off {
      0%   { filter: brightness(1);   transform: scaleY(1);      opacity: 1; }
      35%  { filter: brightness(2.2); transform: scaleY(1);      opacity: 1; }
      75%  { filter: brightness(5);   transform: scaleY(0.012);  opacity: 1; }
      92%  { filter: brightness(8);   transform: scaleY(0.004) scaleX(0.55); opacity: 1; }
      100% { filter: brightness(9);   transform: scaleY(0.002) scaleX(0.3);  opacity: 0; }
    }

    @keyframes beam-on {
      0%   { opacity: 0; transform: scaleY(0.005); filter: brightness(6); }
      35%  { opacity: 1; transform: scaleY(0.005); filter: brightness(6); }
      55%  { transform: scaleY(1); filter: brightness(2.2); }
      100% { transform: scaleY(1); filter: brightness(1); }
    }

    /* ---------- 右上角固定按钮：静音 / 挂断 ---------- */
    #ctrls {
      position: fixed;
      top: 12px;
      right: 14px;
      z-index: 30;
      display: flex;
      gap: 8px;
    }

    #ctrls button, #ctrls a {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      font-size: 17px;
      font-family: inherit;
      color: var(--fg-dim);
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--fg-dim);
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
    }

    #ctrls button:hover, #ctrls a:hover {
      color: var(--fg);
      border-color: var(--fg);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.22);
    }

    /* ---------- DOS 蓝色状态栏 ---------- */
    #statusbar {
      flex-shrink: 0;
      display: none;
      align-items: center;
      gap: 16px;
      padding: 3px 10px;
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #e8e8e8;
      background: var(--dos-blue);
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
    }

    #statusbar.on { display: flex; }

    #statusbar .key {
      color: var(--yellow);
      font-weight: bold;
      margin-right: 3px;
    }

    #statusbar .fill { flex: 1; }

    #statusbar .right { color: #b8b8f0; overflow: hidden; text-overflow: ellipsis; }

    /* ---------- 手机端 ---------- */
    @media (max-width: 640px) {
      body { padding: 10px; }
      #crt { padding: 14px 14px 16px; border-radius: 14px; box-shadow: 0 0 0 6px #16171c, 0 0 0 8px #0b0c0f, 0 14px 40px rgba(0, 0, 0, 0.85), inset 0 0 90px rgba(0, 0, 0, 0.9); }
      #screen { font-size: 12px; }
      #screen p.art { font-size: 12px; }
      .cn { font-size: 12px; }
      #power .pwr-txt { font-size: 12px; }
    }

    /* 用户偏好减少动态效果：关掉闪烁、滚纹与噪点动画 */
    @media (prefers-reduced-motion: reduce) {
      #screen, #mirror .m-cur { animation: none; }
      #crt.booting #screen { animation: none; }
      #band, #noise { animation: none; }
    }
  </style>
</head>
<body>

  <div id="ctrls">
    <button id="mute" type="button" title="静音 / 取消静音" aria-label="切换声音">🔊</button>
    <a href="index.html" id="exit-link" title="挂断并返回现代模式" aria-label="挂断并返回现代模式">✕</a>
  </div>

  <div id="crt">
    <div id="band" aria-hidden="true"></div>
    <div id="glare" aria-hidden="true"></div>
    <div id="noise" aria-hidden="true"></div>

    <div id="screen" aria-live="polite"></div>

    <div id="input-row">
      <span id="prompt"></span><span id="input-wrap"><span id="mirror"><span id="mirror-inner"></span></span><input id="kb" type="text" autocomplete="off"
        autocapitalize="off" spellcheck="false" aria-label="终端输入" /></span>
    </div>

    <div id="statusbar" aria-hidden="true">
      <span><span class="key">F1</span>帮助</span>
      <span><span class="key">Esc</span>退出复古模式</span>
      <span class="fill"></span>
      <span class="right" id="sb-right">PaperClip DOS v6.22</span>
    </div>

    <!-- 开机层：浏览器要求音频必须有用户手势才能播放 -->
    <div id="power" role="button" tabindex="0" aria-label="接通电源，开机">
      <div class="pwr-icon">⏻</div>
      <div class="pwr-txt">PUSH POWER · 接通电源</div>
      <div class="pwr-sub">PaperClip 486DX2/66 · 请戴耳机体验拨号音</div>
    </div>
  </div>

  <script>
    /* ============================================================
       PaperClip BBS —— 早期拨号 BBS 终端模拟器
       流程：开机自检 → Modem 拨号（WebAudio 合成拨号音/握手声）
             → 登录（呼号）→ 主菜单（键盘指令交互）
       全部本地运行，无任何后端；留言保存在 localStorage。
       ============================================================ */
    (function () {
      "use strict";

      var screen = document.getElementById("screen");
      var crt = document.getElementById("crt");
      var power = document.getElementById("power");
      var inputRow = document.getElementById("input-row");
      var promptEl = document.createElement("span"); // 复用节点：ask() 时填充
      var kb = document.getElementById("kb");
      var mirrorInner = document.getElementById("mirror-inner");
      var statusbar = document.getElementById("statusbar");
      var sbRight = document.getElementById("sb-right");

      /* 状态栏右侧文字：随阶段更新（DOS / 拨号中 / 在线呼号 / 已离线） */
      function sbSet(text) { if (sbRight) sbRight.textContent = text; }

      /* ---------------- 块状光标：镜像层渲染 ----------------
         真实 input 文字透明，镜像层同步显示内容，并把块状光标
         插在真实插入点（selectionStart）上：方向键移动、点击定位、
         拖选反显都能正确反映；输入时重建光标节点，打字期间常亮 */
      function syncScroll() {
        if (mirrorInner) mirrorInner.style.transform = "translateX(" + -(kb.scrollLeft || 0) + "px)";
      }

      function renderMirror() {
        if (!mirrorInner) return;
        var v = kb.value;
        if (kb.type === "password") v = new Array(v.length + 1).join("*");
        var s = kb.selectionStart == null ? v.length : kb.selectionStart;
        var e = kb.selectionEnd == null ? s : kb.selectionEnd;
        mirrorInner.textContent = "";
        if (s > 0) mirrorInner.appendChild(document.createTextNode(v.slice(0, s)));
        if (e > s) {
          var sel = document.createElement("span");
          sel.className = "m-sel";
          sel.textContent = v.slice(s, e);
          mirrorInner.appendChild(sel);
        }
        var cur = document.createElement("span");
        cur.className = "m-cur";
        mirrorInner.appendChild(cur);
        if (e < v.length) mirrorInner.appendChild(document.createTextNode(v.slice(e)));
        syncScroll();
      }

      kb.addEventListener("input", renderMirror);
      kb.addEventListener("keyup", renderMirror);
      kb.addEventListener("click", renderMirror);
      kb.addEventListener("scroll", syncScroll);
      document.addEventListener("selectionchange", function () {
        if (document.activeElement === kb) renderMirror();
      });

      var history = [];       // 输入历史（↑/↓ 翻阅）
      var histPos = -1;
      var muted = false;
      var dialDone = false;   // 拨号阶段按任意键可跳过
      var skipFlag = false;   // 置位后：type() 立即补完，dialSleep() 提前唤醒
      var inDial = false;     // 是否处于动画阶段（开机/拨号，允许跳过）
      var leaving = false;    // 正在退出复古模式（Esc），屏蔽一切输入
      var bbsEnded = false;   // BBS 已挂断（区别于退出页面）

      /* ---------------- 音频：WebAudio 合成 modem 音效 ---------------- */
      var ac = null, master = null;

      function audioInit() {
        if (ac) return;
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain();
          master.gain.value = 0.6;
          master.connect(ac.destination);
        } catch (e) { ac = null; }
      }

      function beep(freq, dur, gain, type, when) {
        if (!ac || muted) return;
        var t = when || ac.currentTime;
        var o = ac.createOscillator();
        var g = ac.createGain();
        o.type = type || "sine";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(gain || 0.05, t + 0.012);
        g.gain.setValueAtTime(gain || 0.05, t + dur - 0.02);
        g.gain.linearRampToValueAtTime(0, t + dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.02);
        trackSfx(o);
      }

      /* 活跃音源登记：双击跳过拨号时，已排期但还没播完的
         拨号音/握手噪声需要立刻停掉，不能让画面和声音脱节 */
      var liveSfx = [];
      function trackSfx(node) {
        liveSfx.push(node);
        node.onended = function () {
          var i = liveSfx.indexOf(node);
          if (i !== -1) liveSfx.splice(i, 1);
        };
      }
      function stopAllSfx() {
        liveSfx.forEach(function (n) {
          try { n.stop(); } catch (e) {}
        });
        liveSfx = [];
      }

      /* 拨号音：350Hz + 440Hz 双音（北美标准拨号音） */
      function dialTone(dur) {
        if (!ac || muted) return;
        var t = ac.currentTime;
        beep(350, dur, 0.045, "sine", t);
        beep(440, dur, 0.045, "sine", t);
      }

      /* DTMF 拨号：每个数字一对频率，短促连发 */
      var DTMF = {
        "1": [697, 1209], "2": [697, 1336], "3": [697, 1477],
        "4": [770, 1209], "5": [770, 1336], "6": [770, 1477],
        "7": [852, 1209], "8": [852, 1336], "9": [852, 1477],
        "0": [941, 1336]
      };
      function dialDigits(numStr) {
        if (!ac || muted) return;
        var t = ac.currentTime + 0.1;
        for (var i = 0; i < numStr.length; i++) {
          var f = DTMF[numStr[i]];
          if (!f) continue;
          beep(f[0], 0.09, 0.05, "sine", t);
          beep(f[1], 0.09, 0.05, "sine", t);
          t += 0.16;
        }
        return t - ac.currentTime;
      }

      /* 握手噪音：白噪声过带通滤波器，频率来回扫，模拟应答/协商 */
      function handshake(dur) {
        if (!ac || muted) return;
        var t = ac.currentTime;
        var len = Math.floor(ac.sampleRate * dur);
        var buf = ac.createBuffer(1, len, ac.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        var src = ac.createBufferSource();
        src.buffer = buf;
        var bp = ac.createBiquadFilter();
        bp.type = "bandpass";
        bp.Q.value = 6;
        bp.frequency.setValueAtTime(1200, t);
        bp.frequency.linearRampToValueAtTime(2400, t + dur * 0.4);
        bp.frequency.linearRampToValueAtTime(900, t + dur * 0.8);
        bp.frequency.linearRampToValueAtTime(1800, t + dur);
        var g = ac.createGain();
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.05, t + 0.2);
        g.gain.setValueAtTime(0.05, t + dur - 0.3);
        g.gain.linearRampToValueAtTime(0, t + dur);
        src.connect(bp); bp.connect(g); g.connect(master);
        src.start(t);
        trackSfx(src);
        /* 混入几声 2100Hz 应答音 */
        beep(2100, 0.5, 0.04, "sine", t + 0.1);
        beep(1300, 0.35, 0.04, "sine", t + dur * 0.55);
        beep(2100, 0.3, 0.035, "sine", t + dur - 0.4);

      function scrollBottom() { screen.scrollTop = screen.scrollHeight; }

      /* print：整行立即出现（用于高速滚动的系统报文） */
      function print(text, cls) {
        var p = document.createElement("p");
        if (cls) p.className = cls;
        p.textContent = text === undefined ? "" : text;
        screen.appendChild(p);
        scrollBottom();
        return p;

      /* type：逐字打印。返回 Promise；skipFlag 置位时立即补完整行 */
      var typing = null;   // 当前正在打印的 p 节点
      var curJob = null;   // 当前打印任务（skip 时立即补完用）
      function type(text, cls, cps) {
        return new Promise(function (resolve) {
          var p = print("", cls);
          typing = p;
          var i = 0;
          var full = String(text);
          var job = {
            p: p, full: full,
            finish: function () {
              p.textContent = full;
              typing = null; curJob = null;
              scrollBottom();
              resolve();
            }
          };
          curJob = job;
          var step = function () {
            if (skipFlag || typing !== p) { job.finish(); return; }
            /* 一次吐 1-2 字，速度带随机抖动，模拟串口吞吐不均 */
            p.textContent = full.slice(0, i += (Math.random() < 0.3 ? 2 : 1));
            scrollBottom();
            if (i < full.length) {
              setTimeout(step, (cps || 26) + Math.random() * 26);
            } else {
              typing = null; curJob = null;
              resolve();
            }
          };
          step();
        });
      }

      /* 拨号阶段的等待：双击屏幕可跳过（skipFlag 提前唤醒） */
      function dialSleep(ms) {
        return new Promise(function (r) {
          var t0 = Date.now();
          var iv = setInterval(function () {
            if (skipFlag || Date.now() - t0 >= ms) { clearInterval(iv); r(); }
          }, 60);
        });
      }

      /* ---------------- 输入：ask() 返回 Promise ---------------- */
      function ask(promptText, masked) {
        return new Promise(function (resolve) {
          promptEl.textContent = promptText;
          var old = document.getElementById("prompt");
          if (old) old.replaceWith(promptEl);
          else inputRow.insertBefore(promptEl, kb);
          promptEl.id = "prompt";
          kb.type = masked ? "password" : "text";
          kb.value = "";
          inputRow.classList.add("on");
          histPos = -1;
          kb.focus();
          renderMirror();
          kb.onkeydown = function (e) {
            if (e.key === "Enter") {
              var val = kb.value.trim();
              kb.onkeydown = null;
              inputRow.classList.remove("on");
              /* 回显用户输入（密码输入打星号），随后隐藏输入行 */
              var echo = masked ? new Array(val.length + 1).join("*") : val;
              print(promptText + echo, "wht");
              if (val) { history.push(val); if (history.length > 40) history.shift(); }
              resolve(val);
            } else if (e.key === "ArrowUp") {
              if (!history.length) return;
              histPos = histPos === -1 ? history.length - 1 : Math.max(0, histPos - 1);
              kb.value = history[histPos];
              e.preventDefault();
            } else if (e.key === "ArrowDown") {
              if (histPos === -1) return;
              histPos++;
              if (histPos >= history.length) { histPos = -1; kb.value = ""; }
              else kb.value = history[histPos];
              e.preventDefault();
            } else {
              click();
            }
          };
        });
      }

      var FONT = {
        P: ["████", "█  █", "████", "█   ", "█   "],
        A: ["████", "█  █", "████", "█  █", "█  █"],
        E: ["████", "█   ", "███ ", "█   ", "████"],
        R: ["████", "█  █", "████", "█ █ ", "█  █"],

        L: ["█   ", "█   ", "█   ", "█   ", "████"],
        I: ["███ ", " █  ", " █  ", " █  ", "███ "],
      };
      function asciiArt(word) {
        var rows = ["", "", "", "", ""];
        for (var k = 0; k < word.length; k++) {
          var g = FONT[word.charAt(k)];
          if (!g) continue;
          /* 像素字体中 █ 为全角（2 列），补位空格须用全角空格才能对齐 */
          for (var r = 0; r < 5; r++) rows[r] += g[r].replace(/ /g, "\u3000") + "\u3000";
        }
        return rows.join("\n");
      }

      /* 菜单框线：按"渲染列宽"生成（像素字体下 ASCII=1 列、全角=2 列），
         保证框线在像素等宽字体下严格对齐 */
      function dispCols(s) {
        var w = 0;
        for (var i = 0; i < s.length; i++) w += s.charCodeAt(i) > 0xff ? 2 : 1;
        return w;
      }
      function padCols(s, n) {
        while (dispCols(s) < n) s += " ";
        return s;
      }
      function rep(s, n) { return new Array(n + 1).join(s); }

      /* MC 服务器实时状态查询（与 minecraft.html 共用 minebbs 接口） */
      function fetchMcStatus() {
        return fetch(
          "https://motd.minebbs.com/api/status?ip=" + encodeURIComponent(MC_HOST) +
          "&port=" + encodeURIComponent(MC_PORT)
        ).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        });
      }

      /* minebbs 的 motd 是 MC JSON 文本组件，递归拍平成纯文本 */
      function mcMotdText(c) {
        if (!c) return "";
        var t = c.text || "";
        if (c.extra && c.extra.length) {
          for (var i = 0; i < c.extra.length; i++) t += mcMotdText(c.extra[i]);
        }
        return t;
      }


      /* ---------------- 指令解析 ---------------- */
      function renderLines(rows, typed) {
        var chain = Promise.resolve();
        rows.forEach(function (row) {
          chain = chain.then(function () {
            if (typed) return type(row[0], row[1]);
            print(row[0], row[1]);
            return sleep(18);
          });
        });
        return chain;
      }

      async function dispatch(raw) {
        var cmd = raw.toLowerCase();

        /* 留言：非指令的自由文本直接入库（长度>1 且不含空格指令特征时） */
        var msgCmd = cmd.match(/^msg\s+([\s\S]+)/);

        if (cmd === "help" || cmd === "h" || cmd === "?" || cmd === "菜单") {
          chime();
          print(MENU, "dim");
        } else if (cmd === "1" || cmd === "about" || cmd === "whoami" || cmd === "站长") {
          await renderLines(cmdAbout(), true);
        } else if (cmd === "2" || cmd === "trace" || cmd === "timeline" || cmd === "轨迹") {
          await renderLines(cmdTimeline(), true);
        } else if (cmd === "3" || cmd === "skills" || cmd === "技能") {
          await renderLines(cmdSkills(), true);
        } else if (cmd === "4" || cmd === "board" || cmd === "bulletin" || cmd === "布告") {
          await cmdBoard();
        } else if (cmd === "5" || cmd === "msg" || cmd === "留言") {
          await renderLines(cmdMsg(), true);
        } else if (msgCmd && msgCmd[1] === "list") {
          await renderLines(msgList(), true);
        } else if (msgCmd && msgCmd[1]) {
          msgSave(msgCmd[1]);
          chime();
          await renderLines([["  ▸ 已写入磁带：" + msgCmd[1], "amb"]], true);
        } else if (cmd === "6" || cmd === "who" || cmd === "users" || cmd === "在线") {
          await renderLines(cmdUsers(), true);
        } else if (cmd === "7" || cmd === "time" || cmd === "date" || cmd === "时间") {
          await renderLines(cmdTime(), true);
        } else if (cmd === "fortune" || cmd === "签") {
          await type(FORTUNES[Math.floor(Math.random() * FORTUNES.length)], "cyn");
          print("");
        } else if (cmd === "clear" || cmd === "cls") {
          screen.innerHTML = "";
        } else if (cmd === "exit" || cmd === "quit" || cmd === "bye" || cmd === "x" || cmd === "挂断" || cmd === "下线") {
          await hangup();
        } else if (raw.length >= 2 && cmd.charAt(0) !== "/" ) {
          /* 自由文本 → 视作留言，模拟老 BBS 的聊天/留言习惯 */
          msgSave(raw);
          await type("  （已悄悄帮你写进留言板，msg list 可以查看）", "dim");
          print("");
        } else {
          await type("未知指令：" + raw + "   输入 help 查看指令表", "err");
          print("");
        }
      }

      /* ---------------- BBS 主循环 ---------------- */
      async function bbsLoop() {
        while (!bbsEnded && !leaving) {
          var raw = await ask("BBS> ");
          if (bbsEnded || leaving) break;
          if (!raw) continue;
          await dispatch(raw);
        }
      }

      /* 挂断：保存设置 → 挂断音 → NO CARRIER → 返回 DOS（不退出页面） */
      async function hangup() {
        if (bbsEnded) return;
        bbsEnded = true;
        inputRow.classList.remove("on");
        await type("正在保存设置... OK", "dim");
        await sleep(350);

        sbSet("C:\\BBS · 已离线");
        await type("感谢上站，" + handle + " 。正在返回 DOS ...", "dim");
        await sleep(400);
      }

        /* 跳过机制只服务动画阶段，登录起恢复正常节奏 */
        inDial = false;
        dialDone = false;
        skipFlag = false;

        /* 登录：老用户留空即可找回上次呼号，否则分配临时呼号 */
        var saved = null;

        if (saved) print("(检测到旧呼号存档 " + saved + " ，直接回车即可找回)", "dim");

      async function dosDispatch(raw) {
        var line = raw.trim();
        var cmd = line.toLowerCase();
        if (!cmd) return;

        /* bbs.exe：重头戏，拨号上站 */
        if (cmd === "bbs" || cmd === "bbs.exe") {
          print("");
          await runBBS();
          if (!leaving) print("");
          return;
        }

        if (cmd === "help" || cmd === "?") {
          await renderLines(dosHelp(), true);
        } else if (cmd === "dir") {
          await renderLines(dosDir(), false);
        } else if (cmd === "cd") {
          print("C:\\" + cwd);
        } else if (cmd === "cd.." || cmd.indexOf("cd ") === 0 || cmd.indexOf("cd\\") === 0) {
          var arg = cmd === "cd.." ? ".." : (cmd.indexOf("cd\\") === 0 ? cmd.slice(2) : cmd.slice(3).trim());
          if (arg === "..") {
            cwd = cwd.split("\\").slice(0, -1).join("\\");
          } else if (arg === "\\" || arg === "/") {
            cwd = "";
          } else {
            var hit = findEntry(arg);
            if (hit && hit.d) {
              cwd = cwd ? cwd + "\\" + hit.n : hit.n;
            } else {
              await type("找不到路径 " + arg + " 。先 DIR 看看有什么吧。", "err");
              print("");
            }
          }
        } else if (cmd.indexOf("type ") === 0) {
          var f = cmd.slice(5).trim();
          var entry = findEntry(f);
          if (!entry) {
            await type("找不到文件 " + f + " 。", "err");
            print("");
          } else if (!entry.c) {
            print("†°Æ►?∂ì" + Math.random().toString(36).slice(2, 8).toUpperCase() + "!!#@ ", "dim");
            await type("  （二进制文件，TYPE 看不了，直接运行它试试）", "dim");
            print("");
          } else {
            await renderLines(entry.c.map(function (t) { return [t, ""]; }), true);
            print("");
          }
        } else if (cmd === "ver") {
          print("");
          print("PaperClip DOS Version 6.22", "wht");
          print("回形针中文版 · UCDOS 内核 · 1997", "dim");
          print("");
        } else if (cmd === "mem") {
          await renderLines(dosMem(), true);
        } else if (cmd === "time" || cmd === "date") {
          var d = new Date();
          print("当前日期: " + (d.getMonth() + 1) + "-" + d.getDate() + "-" + d.getFullYear() +
            "    当前时间: " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2));
          print("");
        } else if (cmd === "cls" || cmd === "clear") {
          screen.innerHTML = "";
        } else if (cmd === "win" || cmd === "windows") {
          await type("此电脑未安装 Windows。1997 年的装机商说：先学会 DOS。", "amb");
          print("");
        } else if (cmd.indexOf("format") === 0) {
          await type("警告：C: 盘所有数据将丢失！……逗你的，这块盘我不舍得格。", "err");
          print("");
        } else if (cmd === "edit") {
          await type("EDIT.COM 的磁盘扇区损坏了。看文本请用 TYPE。", "dim");
          print("");
        } else if (cmd === "doom") {
          await type("DOOM 需要 4MB 常规内存。很遗憾，DOS 只分给你 640K。", "err");
          print("");
        } else if (cmd.indexOf("ping") === 0) {
          /* ping：查询 Minecraft 服务器实时状态（联网） */
          var host = cmd.slice(4).trim() || MC_HOST;
          await type("正在 Ping " + host + " ...", "dim");
          if (host.indexOf(MC_HOST) !== -1) {
            try {
              var st = await fetchMcStatus();
              if (st.status === "online") {
                print("来自 " + MC_HOST + ":" + MC_PORT + " 的回复: 在线 · " + (st.version || "未知版本"), "cyn");
                print("在线玩家: " + ((st.players && st.players.online) != null ? st.players.online : "?") +
                  " / " + ((st.players && st.players.max) != null ? st.players.max : "?"), "");
                var mtxt = (typeof st.pureMotd === "string" && st.pureMotd) || mcMotdText(st.motd);
                if (mtxt) print("MOTD: " + mtxt.replace(/\n+/g, " "), "dim");
              } else {
                print("请求超时。服务器不在线（又炸了）。", "err");
              }
            } catch (e2) {
              await type("Ping 失败：查询接口不可达。", "err");
              print("");
            }
          } else {
            await type("Ping 请求超时（这台 486 只认识 " + MC_HOST + "）。", "err");
            print("");
          }
        } else {
          print("Bad command or file name", "err");
        }
      }

        bootSequence();
      });
      power.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); audioInit(); bootSequence(); }
      });
    })();
  </script>
</body>
</html>
