<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PaperClip BBS · 拨号上站的复古终端模拟器" />
  <meta name="theme-color" content="#050607" />
  <link rel="icon" type="image/jpeg" href="00.jpg" />
  <title>PaperClip BBS · 复古模式</title>
  <style>
    /* ---------- 复古像素字体：Fusion Pixel（OFL 开源，本地 fonts/ 目录）
       12px 网格点阵字库，含 latin 与简体中文字形；字号取 12 的整数倍
       （24px / 12px）保证像素锐利不失真 ---------- */
    @font-face {
      font-family: "Fusion Pixel";
      src: url("fonts/fusion-pixel-12px-monospaced-latin.ttf.woff2") format("woff2");
      font-display: swap;
      unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF, U+2500-257F, U+2580-259F, U+25A0-25FF;
    }
    @font-face {
      font-family: "Fusion Pixel";
      src: url("fonts/fusion-pixel-12px-monospaced-zh_hans.ttf.woff2") format("woff2");
      font-display: swap;
    }

    /* ---------- DOS 终端：纯黑屏幕 + 浅灰文字 + ANSI 亮色 ---------- */
    :root {
      --fg: #c9c9c9;            /* DOS 默认浅灰文字 */
      --fg-dim: #6e6e6e;        /* 暗灰 */
      --yellow: #ffe95c;        /* ANSI 亮黄（强调） */
      --cyan: #5ce0e0;          /* ANSI 亮青 */
      --err: #ff5555;           /* ANSI 亮红 */
      --bg: #000000;
      --dos-blue: #0000a8;      /* DOS 状态栏蓝 */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background:
        radial-gradient(ellipse at center, #0b0b0d 0%, var(--bg) 70%),
        var(--bg);
      color: var(--fg);
      font-family: "Fusion Pixel", "Consolas", "Courier New", monospace;
      overflow: hidden;
      padding: 22px;         /* 留出 CRT 显示器外壳边框 */
    }

    /* ---------- 屏幕外壳：曲面圆角 + 显示器边框 + 玻璃内阴影 ---------- */
    #crt {
      position: relative;
      height: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 22px 26px 26px;
      overflow: hidden;
      font-size: 12px;       /* 点阵字体原生尺寸：12px（中文站名除外） */
      border-radius: 20px;
      background: radial-gradient(ellipse at 50% 35%, rgba(255, 255, 255, 0.03), transparent 65%);
      /* 显示器塑料边框圈 + 玻璃曲面内阴影 */
      box-shadow:
        0 0 0 10px #16171c,
        0 0 0 12px #0b0c0f,
        0 22px 60px rgba(0, 0, 0, 0.85),
        inset 0 0 120px rgba(0, 0, 0, 0.9);
      cursor: text;
      display: flex;
      flex-direction: column;
    }

    /* ---------- CRT 玻璃层效果（自下而上：滚纹 → 反光 → 噪点 → 扫描线 → 暗角） ---------- */

    /* 滚动干扰纹：一条淡亮带缓缓从上往下扫过 */
    #band {
      position: absolute;
      left: 0;
      right: 0;
      top: -30%;
      height: 140px;
      z-index: 4;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(255, 255, 255, 0.05) 45%,
        rgba(255, 255, 255, 0.02) 60%,
        transparent
      );
      animation: band-roll 8.5s linear infinite;
    }

    @keyframes band-roll {
      from { top: -25%; }
      to   { top: 115%; }
    }

    /* 玻璃反光：左上一团柔光 + 一道斜向高光 */
    #glare {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      background:
        radial-gradient(ellipse 55% 40% at 20% 6%, rgba(255, 255, 255, 0.075), transparent 60%),
        linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.03) 46%, transparent 55%);
    }

    /* 动态噪点：细颗粒雪花了 */
    #noise {
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      opacity: 0.05;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
      animation: noise-jitter 0.45s steps(4) infinite;
    }

    @keyframes noise-jitter {
      0%   { background-position: 0 0; }
      25%  { background-position: -34px 22px; }
      50%  { background-position: 22px -30px; }
      75%  { background-position: -18px -14px; }
      100% { background-position: 0 0; }
    }

    /* 扫描线 */
    #crt::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0 2px,
        rgba(0, 0, 0, 0.22) 2px 4px
      );
      z-index: 5;
    }

    /* 屏幕暗角 */
    #crt::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    }

    /* 轻微闪烁（呼吸式亮度波动） */
    #screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: inherit;    /* 跟随 #crt 的 12px 点阵尺寸 */
      line-height: 1.7;
      /* 文字发光 + 轻微 RGB 色差（红/青错边），模拟荧光粉成像 */
      text-shadow:
        1px 0 0 rgba(255, 70, 70, 0.24),
        -1px 0 0 rgba(60, 220, 255, 0.24),
        0 0 4px rgba(230, 230, 230, 0.2);
      animation: flicker 4.2s infinite;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--fg-dim) transparent;
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92%      { opacity: 1; }
      93%      { opacity: 0.86; }
      94%      { opacity: 1; }
      97%      { opacity: 0.93; }
      98%      { opacity: 1; }
    }

    #screen p { white-space: pre-wrap; word-break: break-all; min-height: 1.5em; }
    #screen a { color: var(--amber); text-decoration: underline; }

    .dim  { color: var(--fg-dim); text-shadow: none; }
    .amb  { color: var(--yellow); text-shadow: 0 0 6px rgba(255, 233, 92, 0.3); }
    .err  { color: var(--err); text-shadow: 0 0 6px rgba(255, 85, 85, 0.3); }
    .wht  { color: #ffffff; text-shadow: 0 0 4px rgba(255, 255, 255, 0.25); }
    .cyn  { color: var(--cyan); text-shadow: 0 0 6px rgba(92, 224, 224, 0.28); }

    /* ASCII 横幅：全角块状字符点阵，12px 原生尺寸保证像素锐利且等宽对齐 */
    #screen p.art {
      font-size: 12px;
      line-height: 1.2;
      letter-spacing: 0;
      white-space: pre;
      overflow-x: auto;
    }

    /* Braille 点阵横幅（PORTAL.EXE 的光圈 logo）：字符多、行宽大。
       10px 是 720px 外壳内不横向滚动的上限（最长行 65 字符）；
       全屏模式下内容宽度更大，可以再放大一档 */
    #screen p.art.art-small {
      font-size: 10px;
      line-height: 1.15;
    }

    #crt.aperture #screen p.art.art-small {
      font-size: 12.5px;
    }

    /* ---------- 全屏文字布局：整列靠左 + 2× 像素字号 ----------
       全屏时不让文字拉满整个屏幕：限制 840px 列宽并贴屏幕左侧，
       报表、点线、名册的最长行都不会折行；
       16px 兼顾大屏可读性与点阵锐度 */
    #crt.aperture #screen,
    #crt.aperture #input-row {
      width: 100%;
      max-width: 840px;
      margin-left: 48px;
      margin-right: auto;
      font-size: 16px;
    }

    #crt.aperture .cn { font-size: 24px; }

    /* 全屏下 logo 也跟着列宽放大一档（盲文点阵为平滑缩放） */
    #crt.aperture #screen p.art.art-small { font-size: 12px; line-height: 1; }

    /* ---------- 输入行：提示符 + 透明 input + 块状光标 ---------- */
    #input-row {
      display: none;
      align-items: baseline;
      gap: 0;
      padding: 4px 0 0;
      flex-shrink: 0;
    }

    #input-row.on { display: flex; }

    #prompt { white-space: pre; }

    /* 输入区：真实 input 透明叠加，镜像层负责显示文字与块状光标 */
    #input-wrap {
      position: relative;
      flex: 1;
      min-width: 80px;
      overflow: hidden;
    }

    #mirror {
      display: block;
      min-height: 1.5em;
      white-space: pre;
    }

    #mirror-inner {
      display: inline-block;
      white-space: pre;
    }

    /* 块状光标：跟随真实插入点，输入时自动重置闪烁 */
    #mirror .m-cur {
      display: inline-block;
      width: 0.62em;
      height: 1.1em;
      margin-right: 1px;
      background: var(--fg);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.35);
      animation: blink 1.06s steps(1) infinite;
      vertical-align: text-bottom;
    }

    /* 选中文字反色显示（选区功能） */
    #mirror .m-sel {
      background: var(--fg);
      color: #000;
      text-shadow: none;
    }

    #kb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: transparent;
      caret-color: transparent; /* 原生竖线隐藏，由镜像光标替代 */
      font: inherit;
      text-shadow: none;
    }

    /* 中文站名：大字号宽字距排印 */
    .cn {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.45em;
      color: var(--yellow);
      text-shadow: 0 0 8px rgba(255, 233, 92, 0.35);
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* ---------- 开机覆盖层：需要一次点击来解锁音频 ---------- */
    #power {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--bg);
      cursor: pointer;
      text-align: center;
      padding: 24px;
    }

    #power .pwr-icon {
      width: 74px;
      height: 74px;
      border: 2px solid var(--phos-dim);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 34px;
      color: var(--phos-dim);
      transition: all 0.3s ease;
      box-shadow: 0 0 0 0 rgba(61, 255, 124, 0);
    }

    #power:hover .pwr-icon {
      color: var(--fg);
      border-color: var(--fg);
      box-shadow: 0 0 26px rgba(255, 255, 255, 0.25);
    }

    #power .pwr-txt { font-size: 12px; letter-spacing: 0.2em; }
    #power .pwr-sub { font-size: 12px; color: var(--fg-dim); letter-spacing: 0.1em; }

    /* 开机瞬间的电子束闪光 */
    #crt.booting #screen { animation: beam-on 0.55s ease-out, flicker 4.2s 0.55s infinite; }

    /* 关机：亮度骤增 → 电子束收缩成一条亮线 → 熄灭成一个点 */
    #crt.off {
      pointer-events: none;
      animation: beam-off 0.6s ease-in forwards;
    }

    @keyframes beam-off {
      0%   { filter: brightness(1);   transform: scaleY(1);      opacity: 1; }
      35%  { filter: brightness(2.2); transform: scaleY(1);      opacity: 1; }
      75%  { filter: brightness(5);   transform: scaleY(0.012);  opacity: 1; }
      92%  { filter: brightness(8);   transform: scaleY(0.004) scaleX(0.55); opacity: 1; }
      100% { filter: brightness(9);   transform: scaleY(0.002) scaleX(0.3);  opacity: 0; }
    }

    @keyframes beam-on {
      0%   { opacity: 0; transform: scaleY(0.005); filter: brightness(6); }
      35%  { opacity: 1; transform: scaleY(0.005); filter: brightness(6); }
      55%  { transform: scaleY(1); filter: brightness(2.2); }
      100% { transform: scaleY(1); filter: brightness(1); }
    }

    /* ---------- DOS 蓝色状态栏 ---------- */
    #statusbar {
      flex-shrink: 0;
      display: none;
      align-items: center;
      gap: 16px;
      padding: 3px 10px;
      margin-top: 6px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: #e8e8e8;
      background: var(--dos-blue);
      user-select: none;
      white-space: nowrap;
      overflow: hidden;
    }

    #statusbar.on { display: flex; }

    #statusbar .key {
      color: var(--yellow);
      font-weight: bold;
      margin-right: 3px;
    }

    #statusbar .fill { flex: 1; }

    #statusbar .right { color: #b8b8f0; overflow: hidden; text-overflow: ellipsis; }

    /* ---------- PORTAL.EXE：光圈科技终端配色 ----------
       终端里所有文字颜色都走 --fg/--yellow/--cyan 等 CSS 变量，
       所以在 #crt 上换一套变量即可整体切换成 Portal 的蓝橙荧光；
       所有层都挂了 transition：进入时老 CRT 渐变成干净的现代面板，
       退出时再渐变回 1997 年的破屏幕 */
    #crt {
      transition: background 0.9s ease, color 0.9s ease, box-shadow 0.9s ease;
    }

    #screen {
      transition: color 0.9s ease, text-shadow 0.9s ease;
    }

    #noise, #band { transition: opacity 0.9s ease; }
    #statusbar { transition: background 0.9s ease; }
    #crt::after, #crt::before { transition: opacity 0.9s ease; }

    #crt.aperture {
      --fg: #00A3FF;            /* Portal Blue：正文主色 */
      --fg-dim: #7d8489;        /* 中性灰（Logo Dark Grey 提亮到可读） */
      --yellow: #FF6B00;        /* Portal Orange：标题与强调 */
      --cyan: #00A3FF;
      --err: #ff5533;
      --dos-blue: #333333;      /* 状态栏：Logo Dark Grey */
      background: radial-gradient(ellipse at center, #141618 0%, #060707 70%);
      color: var(--fg);         /* body 层已解析过继承色，这里必须显式重声明 */
    }

    /* 状态栏右侧文字：原配色偏紫，光圈模式里换成中性灰 */
    #crt.aperture #statusbar .right { color: #a8adb0; }

    /* 现代面板化：关噪点、关滚纹、停闪烁，扫描线与暗角淡化 */
    #crt.aperture #screen { animation: none; }
    #crt.aperture #noise, #crt.aperture #band { opacity: 0; }
    #crt.aperture::after { opacity: 0.35; }
    #crt.aperture::before { opacity: 0.45; }

    /* ---------- 光圈模式全屏：现代面板铺满视口，退出时收缩回外壳 ----------
       .aperture 挂上即展开（portal-in 动画）；退出时先挂 .portal-out 播放
       收缩动画，动画结束后再摘掉两个类，回到 720px 的 486 显示器 */
    #crt.aperture {
      position: fixed;
      inset: 10px;
      z-index: 50;
      max-width: none;
      margin: 0;
      animation: portal-in 0.7s ease;
    }

    @keyframes portal-in {
      from { transform: scale(0.93); opacity: 0.3; filter: brightness(2.2); }
      to   { transform: scale(1);    opacity: 1;   filter: brightness(1); }
    }

    #crt.portal-out { animation: portal-out 0.7s ease forwards; }

    @keyframes portal-out {
      from { transform: scale(1);    opacity: 1;   filter: brightness(1); }
      to   { transform: scale(0.93); opacity: 0.3; filter: brightness(2.2); }
    }

    #crt.aperture #screen {
      text-shadow:
        1px 0 0 rgba(0, 163, 255, 0.22),
        -1px 0 0 rgba(255, 107, 0, 0.16),
        0 0 4px rgba(255, 255, 255, 0.18);
    }

    /* ---------- 手机端 ---------- */
    @media (max-width: 640px) {
      body { padding: 10px; }
      #crt { padding: 14px 14px 16px; border-radius: 14px; box-shadow: 0 0 0 6px #16171c, 0 0 0 8px #0b0c0f, 0 14px 40px rgba(0, 0, 0, 0.85), inset 0 0 90px rgba(0, 0, 0, 0.9); }
      #screen { font-size: 12px; }
      #screen p.art { font-size: 12px; }
      .cn { font-size: 12px; }
      #power .pwr-txt { font-size: 12px; }
      /* 光圈全屏在小屏上回到 1× 点阵字号与全宽列 */
      #crt.aperture #screen, #crt.aperture #input-row { font-size: 12px; max-width: none; }
      #crt.aperture .cn { font-size: 12px; }
      #crt.aperture #screen p.art.art-small { font-size: 8px; }
    }

    /* 用户偏好减少动态效果：关掉闪烁、滚纹与噪点动画 */
    @media (prefers-reduced-motion: reduce) {
      #screen, #mirror .m-cur { animation: none; }
      #crt.booting #screen { animation: none; }
      #band, #noise { animation: none; }
      #crt.aperture, #crt.portal-out { animation: none; }
    }
  </style>
</head>
<body>

  <div id="crt">
    <div id="band" aria-hidden="true"></div>
    <div id="glare" aria-hidden="true"></div>
    <div id="noise" aria-hidden="true"></div>

    <div id="screen" aria-live="polite"></div>

    <div id="input-row">
      <span id="prompt"></span><span id="input-wrap"><span id="mirror"><span id="mirror-inner"></span></span><input id="kb" type="text" autocomplete="off"
        autocapitalize="off" spellcheck="false" aria-label="终端输入" /></span>
    </div>

    <div id="statusbar" aria-hidden="true">
      <span><span class="key">F1</span>帮助</span>
      <span><span class="key">Esc</span>退出复古模式</span>
      <span class="fill"></span>
      <span class="right" id="sb-right">PaperClip DOS v6.22</span>
    </div>

    <!-- 开机层：浏览器要求音频必须有用户手势才能播放 -->
    <div id="power" role="button" tabindex="0" aria-label="接通电源，开机">
      <div class="pwr-icon">⏻</div>
      <div class="pwr-txt">PUSH POWER · 接通电源</div>
      <div class="pwr-sub">PaperClip 486DX2/66 · 请戴耳机体验拨号音</div>
    </div>
  </div>

  <script>
    /* ============================================================
       PaperClip BBS —— 早期拨号 BBS 终端模拟器
       流程：开机自检 → Modem 拨号（WebAudio 合成拨号音/握手声）
             → 登录（呼号）→ 主菜单（键盘指令交互）
       全部本地运行，无任何后端；留言保存在 localStorage。
       ============================================================ */
    (function () {
      "use strict";

      var screen = document.getElementById("screen");
      var crt = document.getElementById("crt");
      var power = document.getElementById("power");
      var inputRow = document.getElementById("input-row");
      var promptEl = document.createElement("span"); // 复用节点：ask() 时填充
      var kb = document.getElementById("kb");
      var mirrorInner = document.getElementById("mirror-inner");
      var statusbar = document.getElementById("statusbar");
      var sbRight = document.getElementById("sb-right");

      /* 状态栏右侧文字：随阶段更新（DOS / 拨号中 / 在线呼号 / 已离线） */
      function sbSet(text) { if (sbRight) sbRight.textContent = text; }

      /* ---------------- 块状光标：镜像层渲染 ----------------
         真实 input 文字透明，镜像层同步显示内容，并把块状光标
         插在真实插入点（selectionStart）上：方向键移动、点击定位、
         拖选反显都能正确反映；输入时重建光标节点，打字期间常亮 */
      function syncScroll() {
        if (mirrorInner) mirrorInner.style.transform = "translateX(" + -(kb.scrollLeft || 0) + "px)";
      }

      function renderMirror() {
        if (!mirrorInner) return;
        var v = kb.value;
        if (kb.type === "password") v = new Array(v.length + 1).join("*");
        var s = kb.selectionStart == null ? v.length : kb.selectionStart;
        var e = kb.selectionEnd == null ? s : kb.selectionEnd;
        mirrorInner.textContent = "";
        if (s > 0) mirrorInner.appendChild(document.createTextNode(v.slice(0, s)));
        if (e > s) {
          var sel = document.createElement("span");
          sel.className = "m-sel";
          sel.textContent = v.slice(s, e);
          mirrorInner.appendChild(sel);
        }
        var cur = document.createElement("span");
        cur.className = "m-cur";
        mirrorInner.appendChild(cur);
        if (e < v.length) mirrorInner.appendChild(document.createTextNode(v.slice(e)));
        syncScroll();
      }

      kb.addEventListener("input", renderMirror);
      kb.addEventListener("keyup", renderMirror);
      kb.addEventListener("click", renderMirror);
      kb.addEventListener("scroll", syncScroll);
      document.addEventListener("selectionchange", function () {
        if (document.activeElement === kb) renderMirror();
      });

      var history = [];       // 输入历史（↑/↓ 翻阅）
      var histPos = -1;
      var completer = null;   // Tab 补全回调：DOS 提示符下提供（dosCompleter），BBS 阶段为 null
      var muted = false;
      var dialDone = false;   // 拨号阶段按任意键可跳过
      var skipFlag = false;   // 置位后：type() 立即补完，dialSleep() 提前唤醒
      var inDial = false;     // 是否处于动画阶段（开机/拨号，允许跳过）
      var leaving = false;    // 正在退出复古模式（Esc），屏蔽一切输入
      var bbsEnded = false;   // BBS 已挂断（区别于退出页面）

      /* ---------------- 音频：WebAudio 合成 modem 音效 ---------------- */
      var ac = null, master = null;

      function audioInit() {
        if (ac) return;
        try {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          master = ac.createGain();
          master.gain.value = 0.6;
          master.connect(ac.destination);
        } catch (e) { ac = null; }
      }

      function beep(freq, dur, gain, type, when) {
        if (!ac || muted) return;
        var t = when || ac.currentTime;
        var o = ac.createOscillator();
        var g = ac.createGain();
        o.type = type || "sine";
        o.frequency.value = freq;
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(gain || 0.05, t + 0.012);
        g.gain.setValueAtTime(gain || 0.05, t + dur - 0.02);
        g.gain.linearRampToValueAtTime(0, t + dur);
        o.connect(g); g.connect(master);
        o.start(t); o.stop(t + dur + 0.02);
        trackSfx(o);
      }

      /* 活跃音源登记：双击跳过拨号时，已排期但还没播完的
         拨号音/握手噪声需要立刻停掉，不能让画面和声音脱节 */
      var liveSfx = [];
      function trackSfx(node) {
        liveSfx.push(node);
        node.onended = function () {
          var i = liveSfx.indexOf(node);
          if (i !== -1) liveSfx.splice(i, 1);
        };
      }
      function stopAllSfx() {
        liveSfx.forEach(function (n) {
          try { n.stop(); } catch (e) {}
        });
        liveSfx = [];
      }

      /* 拨号音：350Hz + 440Hz 双音（北美标准拨号音） */
      function dialTone(dur) {
        if (!ac || muted) return;
        var t = ac.currentTime;
        beep(350, dur, 0.045, "sine", t);
        beep(440, dur, 0.045, "sine", t);
      }

      /* DTMF 拨号：每个数字一对频率，短促连发 */
      var DTMF = {
        "1": [697, 1209], "2": [697, 1336], "3": [697, 1477],
        "4": [770, 1209], "5": [770, 1336], "6": [770, 1477],
        "7": [852, 1209], "8": [852, 1336], "9": [852, 1477],
        "0": [941, 1336]
      };
      function dialDigits(numStr) {
        if (!ac || muted) return;
        var t = ac.currentTime + 0.1;
        for (var i = 0; i < numStr.length; i++) {
          var f = DTMF[numStr[i]];
          if (!f) continue;
          beep(f[0], 0.09, 0.05, "sine", t);
          beep(f[1], 0.09, 0.05, "sine", t);
          t += 0.16;
        }
        return t - ac.currentTime;
      }

      /* 握手噪音：白噪声过带通滤波器，频率来回扫，模拟应答/协商 */
      function handshake(dur) {
        if (!ac || muted) return;
        var t = ac.currentTime;
        var len = Math.floor(ac.sampleRate * dur);
        var buf = ac.createBuffer(1, len, ac.sampleRate);
        var d = buf.getChannelData(0);
        for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        var src = ac.createBufferSource();
        src.buffer = buf;
        var bp = ac.createBiquadFilter();
        bp.type = "bandpass";
        bp.Q.value = 6;
        bp.frequency.setValueAtTime(1200, t);
        bp.frequency.linearRampToValueAtTime(2400, t + dur * 0.4);
        bp.frequency.linearRampToValueAtTime(900, t + dur * 0.8);
        bp.frequency.linearRampToValueAtTime(1800, t + dur);
        var g = ac.createGain();
        g.gain.setValueAtTime(0.001, t);
        g.gain.linearRampToValueAtTime(0.05, t + 0.2);
        g.gain.setValueAtTime(0.05, t + dur - 0.3);
        g.gain.linearRampToValueAtTime(0, t + dur);
        src.connect(bp); bp.connect(g); g.connect(master);
        src.start(t);
        trackSfx(src);
        /* 混入几声 2100Hz 应答音 */
        beep(2100, 0.5, 0.04, "sine", t + 0.1);
        beep(1300, 0.35, 0.04, "sine", t + dur * 0.55);
        beep(2100, 0.3, 0.035, "sine", t + dur - 0.4);
      }

      /* 按键咔哒：打字时极轻的一声 */
      function click() { beep(1350, 0.018, 0.016, "square"); }

      /* 消息提示音：菜单出现的短促 "叮" */
      function chime() { beep(880, 0.08, 0.04); beep(1320, 0.1, 0.035, "sine", ac ? ac.currentTime + 0.09 : 0); }

      /* ---------------- 输出：打字机 ---------------- */
      function scrollBottom() { screen.scrollTop = screen.scrollHeight; }

      /* print：整行立即出现（用于高速滚动的系统报文） */
      function print(text, cls) {
        var p = document.createElement("p");
        if (cls) p.className = cls;
        p.textContent = text === undefined ? "" : text;
        screen.appendChild(p);
        scrollBottom();
        return p;
      }

      /* type：逐字打印。返回 Promise；skipFlag 置位时立即补完整行 */
      var typing = null;   // 当前正在打印的 p 节点
      var curJob = null;   // 当前打印任务（skip 时立即补完用）
      function type(text, cls, cps) {
        return new Promise(function (resolve) {
          var p = print("", cls);
          typing = p;
          var i = 0;
          var full = String(text);
          var job = {
            p: p, full: full,
            finish: function () {
              p.textContent = full;
              typing = null; curJob = null;
              scrollBottom();
              resolve();
            }
          };
          curJob = job;
          var step = function () {
            if (skipFlag || typing !== p) { job.finish(); return; }
            /* 一次吐 1-2 字，速度带随机抖动，模拟串口吞吐不均 */
            p.textContent = full.slice(0, i += (Math.random() < 0.3 ? 2 : 1));
            scrollBottom();
            if (i < full.length) {
              setTimeout(step, (cps || 26) + Math.random() * 26);
            } else {
              typing = null; curJob = null;
              resolve();
            }
          };
          step();
        });
      }

      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

      /* 拨号阶段的等待：双击屏幕可跳过（skipFlag 提前唤醒） */
      function dialSleep(ms) {
        return new Promise(function (r) {
          var t0 = Date.now();
          var iv = setInterval(function () {
            if (skipFlag || Date.now() - t0 >= ms) { clearInterval(iv); r(); }
          }, 60);
        });
      }

      /* ---------------- 输入：ask() 返回 Promise ---------------- */
      function ask(promptText, masked) {
        return new Promise(function (resolve) {
          promptEl.textContent = promptText;
          var old = document.getElementById("prompt");
          if (old) old.replaceWith(promptEl);
          else inputRow.insertBefore(promptEl, kb);
          promptEl.id = "prompt";
          kb.type = masked ? "password" : "text";
          kb.value = "";
          inputRow.classList.add("on");
          histPos = -1;
          kb.focus();
          renderMirror();
          kb.onkeydown = function (e) {
            if (e.key === "Enter") {
              var val = kb.value.trim();
              kb.onkeydown = null;
              inputRow.classList.remove("on");
              /* 回显用户输入（密码输入打星号），随后隐藏输入行 */
              var echo = masked ? new Array(val.length + 1).join("*") : val;
              print(promptText + echo, "wht");
              if (val) { history.push(val); if (history.length > 40) history.shift(); }
              resolve(val);
            } else if (e.key === "ArrowUp") {
              if (!history.length) return;
              histPos = histPos === -1 ? history.length - 1 : Math.max(0, histPos - 1);
              kb.value = history[histPos];
              e.preventDefault();
            } else if (e.key === "ArrowDown") {
              if (histPos === -1) return;
              histPos++;
              if (histPos >= history.length) { histPos = -1; kb.value = ""; }
              else kb.value = history[histPos];
              e.preventDefault();
            } else if (e.key === "Tab" && completer) {
              /* Tab 补全：唯一候选直接补上；多个候选补公共前缀并列出 */
              e.preventDefault();
              var cv = kb.value;
              var cands = completer(cv);
              if (!cands.length) return;
              if (cands.length === 1) {
                kb.value = cands[0];
              } else {
                var pre = cands[0];
                for (var ci = 1; ci < cands.length; ci++) {
                  while (pre && cands[ci].toLowerCase().indexOf(pre.toLowerCase()) !== 0) {
                    pre = pre.slice(0, -1);
                  }
                }
                if (pre && pre !== cv) kb.value = pre;
                print(cands.join("   "), "dim");
              }
              renderMirror();
            } else {
              click();
            }
          };
        });
      }

      /* 点屏幕任意处聚焦输入框（手机端拉起键盘） */
      crt.addEventListener("click", function () {

      var handle = "guest";

      /* 横幅：方块字点阵由程序拼装，保证等宽对齐不出错 */
      var FONT = {
        P: ["████", "█  █", "████", "█   ", "█   "],
        A: ["████", "█  █", "████", "█  █", "█  █"],
        E: ["████", "█   ", "███ ", "█   ", "████"],
        R: ["████", "█  █", "████", "█ █ ", "█  █"],
        C: ["████", "█   ", "█   ", "█   ", "████"],
        L: ["█   ", "█   ", "█   ", "█   ", "████"],
        I: ["███ ", " █  ", " █  ", " █  ", "███ "],
        T: ["████", " █  ", " █  ", " █  ", " █  "],
        U: ["█  █", "█  █", "█  █", "█  █", "████"],
        S: [" ███", "█   ", " ███", "   █", "███ "],
        N: ["█  █", "██ █", "█ ██", "█  █", "█  █"],
      };
      function asciiArt(word) {
        var rows = ["", "", "", "", ""];
        for (var k = 0; k < word.length; k++) {
          var g = FONT[word.charAt(k)];
          if (!g) continue;
          /* 像素字体中 █ 为全角（2 列），补位空格须用全角空格才能对齐 */
          for (var r = 0; r < 5; r++) rows[r] += g[r].replace(/ /g, "\u3000") + "\u3000";
        }
        return rows.join("\n");
      }
      var BANNER = asciiArt("PAPERCLIP");

      /* 菜单框线：按"渲染列宽"生成（像素字体下 ASCII=1 列、全角=2 列），
         保证框线在像素等宽字体下严格对齐 */
      function dispCols(s) {
        var w = 0;
        for (var i = 0; i < s.length; i++) w += s.charCodeAt(i) > 0xff ? 2 : 1;
        return w;
      }
      function padCols(s, n) {
        while (dispCols(s) < n) s += " ";
        return s;
      }
      function rep(s, n) { return new Array(n + 1).join(s); }

      function buildMenu() {
        var items = [
          ["[1] 站长档案", "who is PaperClip"],

        var W = 42;  // 框内渲染列宽
        var lines = ["┌" + rep("─", W / 2) + "┐"];
        lines.push("│" + padCols("        主 菜 单・MAIN BOARD", W) + "│");
        lines.push("├" + rep("─", W / 2) + "┤");
        items.forEach(function (it) {
          lines.push("│" + padCols("  " + padCols(it[0], 16) + it[1], W) + "│");
        });
        lines.push("│" + padCols("", W) + "│");
        lines.push("│" + padCols("  help 帮助   clear 清屏   exit 挂断", W) + "│");
        lines.push("└" + rep("─", W / 2) + "┘");
        return lines.join("\n");
      }

      function bar(pct, width) {
        width = width || 24;

        return s + "] " + (pct + "%");

        var w = 0;
        for (var i = 0; i < s.length; i++) w += s.charCodeAt(i) > 255 ? 2 : 1;
        while (w < n) { s += " "; w++; }
        return s;

      var MSG_KEY = "bbs_msgs";

      /* 读取公开留言：GitHub Discussions 公开 API，无需登录 */
      function fetchPublicMsgs() {

          GH_DISCUSSION + "/comments?per_page=10",

      /* ISO 时间 → BBS 风格 "MM-DD HH:MM" */
      function isoStamp(iso) {
        var d = new Date(iso);
        return ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2) +
          " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
      }

      /* 留言正文压成最多 3 行，每行缩进 4 列 */
      function indentBody(text, maxLines) {
        var lines = text.split("\n").slice(0, maxLines || 3);
        if (text.split("\n").length > (maxLines || 3)) lines.push("……");
        return lines.map(function (l) { return "    " + l; });
      }

      /* ============================================================
         真实站点数据同步：板块内容不再写死，开机时从站内文件抓取
         - index.html → 时间线(.tl-item)、技能(.skill)、简介(.bio/.location)
         - main.js    → 站点版本号 SITE_VERSION、背景音乐曲单
         - minecraft.html 同款 minebbs API → MC 服务器实时状态
         抓取失败（本地 file:// 打开等）时自动沿用各板块内置兜底内容。
         ============================================================ */
      var MC_HOST = "xm.rainplay.cn";
      var MC_PORT = "15991";

      var siteData = {
        timeline: null,   // [{period,title,role,desc}]
        skills: null,     // [{name,pct}]
        bio: null,
        location: null,
        version: "",
        tracks: null,     // [曲名...]
      };

      function loadSiteData() {
        function txt(url) {
          return fetch(url, { cache: "no-cache" }).then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text();
          });
        }
        return Promise.all([txt("index.html"), txt("main.js")])
          .then(function (res) {
            var doc = new DOMParser().parseFromString(res[0], "text/html");

            var tls = doc.querySelectorAll(".tl-item");
            if (tls.length) {
              siteData.timeline = Array.prototype.map.call(tls, function (el) {
                return {
                  period: (el.querySelector(".period") || {}).textContent || "",
                  title: (el.querySelector("h3") || {}).textContent || "",
                  role: (el.querySelector(".role") || {}).textContent || "",
                  desc: (el.querySelector("p") || {}).textContent || "",
                };
              });
            }

            var sks = doc.querySelectorAll(".skill");
            if (sks.length) {
              siteData.skills = Array.prototype.map.call(sks, function (el) {
                return {
                  name: (el.querySelector(".skill-head b") || {}).textContent || "",
                  pct: Math.round(parseFloat((el.querySelector(".skill-head span") || {}).textContent) || 0),
                };
              });
            }

            var bio = doc.querySelector(".bio");
            if (bio) siteData.bio = bio.textContent.replace(/\s+/g, " ").trim();
            var loc = doc.querySelector(".location");
            if (loc) siteData.location = loc.textContent.replace(/\s+/g, " ").trim();

            var vm = res[1].match(/SITE_VERSION\s*=\s*"([^"]+)"/);
            if (vm) siteData.version = vm[1];

            /* 背景音乐曲单（site 组，即终末地音乐） */
            var pm = res[1].match(/site:\s*\{[\s\S]*?tracks:\s*\[([\s\S]*?)\]/);
            if (pm) {
              var names = [], re = /"([^"]+)"/g, m2;
              while ((m2 = re.exec(pm[1]))) names.push(m2[1]);
              if (names.length) siteData.tracks = names;
            }

            /* 曲单到位后同步 DOS 磁盘上的 SONGS.TXT */
            if (siteData.tracks) {
              DISK["C:\\MUSIC"][0].c = [
                "站点 BGM 曲单（明日方舟：终末地 · 共 " + siteData.tracks.length + " 首）：",
                siteData.tracks.join(" · "),
                "完整版在现代模式主页右下角的点唱机里。",
              ];
            }
          })
          .catch(function () { /* 抓取失败：沿用内置兜底数据，功能不受影响 */ });
      }

      /* MC 服务器实时状态查询（与 minecraft.html 共用 minebbs 接口） */
      function fetchMcStatus() {
        return fetch(
          "https://motd.minebbs.com/api/status?ip=" + encodeURIComponent(MC_HOST) +
          "&port=" + encodeURIComponent(MC_PORT)
        ).then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        });
      }

      /* minebbs 的 motd 是 MC JSON 文本组件，递归拍平成纯文本 */
      function mcMotdText(c) {
        if (!c) return "";
        var t = c.text || "";
        if (c.extra && c.extra.length) {
          for (var i = 0; i < c.extra.length; i++) t += mcMotdText(c.extra[i]);
        }
        return t;
      }


      /* ---------------- 指令解析 ---------------- */
      function renderLines(rows, typed) {
        var chain = Promise.resolve();
        rows.forEach(function (row) {
          chain = chain.then(function () {
            if (typed) return type(row[0], row[1]);
            print(row[0], row[1]);
            return sleep(18);
          });
        });
        return chain;
      }

      async function dispatch(raw) {
        var cmd = raw.toLowerCase();

        /* 留言：非指令的自由文本直接入库（长度>1 且不含空格指令特征时） */
        var msgCmd = cmd.match(/^msg\s+([\s\S]+)/);

        if (cmd === "help" || cmd === "h" || cmd === "?" || cmd === "菜单") {
          chime();
          print(MENU, "dim");
        } else if (cmd === "1" || cmd === "about" || cmd === "whoami" || cmd === "站长") {
          await renderLines(cmdAbout(), true);
        } else if (cmd === "2" || cmd === "trace" || cmd === "timeline" || cmd === "轨迹") {
          await renderLines(cmdTimeline(), true);
        } else if (cmd === "3" || cmd === "skills" || cmd === "技能") {
          await renderLines(cmdSkills(), true);
        } else if (cmd === "4" || cmd === "board" || cmd === "bulletin" || cmd === "布告") {
          await cmdBoard();
        } else if (cmd === "5" || cmd === "msg" || cmd === "留言") {
          await renderLines(cmdMsg(), true);
        } else if (msgCmd && msgCmd[1] === "list") {
          await renderLines(await msgList(), true);
        } else if (msgCmd && msgCmd[1] === "send") {
          /* 公开留言需要 GitHub 登录，跳到联系页的 giscus 留言板 */
          await type("正在切换到现代模式 ...（公开留言板在联系页）", "dim");
          await sleep(700);
          location.href = "contact.html#comments";
        } else if (msgCmd && msgCmd[1]) {
          msgSave(msgCmd[1]);
          chime();
          await renderLines([["  ▸ 已写入本地磁带：" + msgCmd[1], "amb"],
            ["    （草稿仅本机可见 · msg send 可去联系页发布公开留言）", "dim"]], true);
        } else if (cmd === "6" || cmd === "who" || cmd === "users" || cmd === "在线") {
          await renderLines(cmdUsers(), true);
        } else if (cmd === "8" || cmd === "mc" || cmd === "server" || cmd === "服务器") {
          await cmdMc();
        } else if (cmd === "7" || cmd === "time" || cmd === "date" || cmd === "时间") {
          await renderLines(cmdTime(), true);
        } else if (cmd === "fortune" || cmd === "签") {
          await type(FORTUNES[Math.floor(Math.random() * FORTUNES.length)], "cyn");
          print("");
        } else if (cmd === "clear" || cmd === "cls") {
          screen.innerHTML = "";
        } else if (cmd === "exit" || cmd === "quit" || cmd === "bye" || cmd === "x" || cmd === "挂断" || cmd === "下线") {
          await hangup();
        } else if (raw.length >= 2 && cmd.charAt(0) !== "/" ) {
          /* 自由文本 → 视作留言草稿，模拟老 BBS 的聊天/留言习惯 */
          msgSave(raw);
          await type("  （已悄悄帮你写进本地磁带，msg list 查看 · msg send 发布公开留言）", "dim");
          print("");
        } else {
          await type("未知指令：" + raw + "   输入 help 查看指令表", "err");
          print("");
        }
      }

      async function bbsLoop() {
        while (!bbsEnded && !leaving) {

          if (!raw) continue;
          await dispatch(raw);

      /* PLAY.MID：用方波 FM 音色真的放一段《致爱丽丝》开头 */
      /* ---- 迷你 MIDI 播放器：解析 .mid 文件，用 WebAudio 排程合成 ---- */
      function parseMidi(buf) {
        var d = new DataView(buf), p = 0;
        function u32() { var v = d.getUint32(p); p += 4; return v; }
        function u16() { var v = d.getUint16(p); p += 2; return v; }
        function u8() { return d.getUint8(p++); }
        function vlq() {
          var v = 0;
          for (;;) {
            var b = u8();
            v = (v << 7) | (b & 0x7f);
            if (!(b & 0x80)) return v;
          }
        }
        function str4() {
          var t = "";
          for (var i = 0; i < 4; i++) t += String.fromCharCode(u8());
          return t;
        }
        if (str4() !== "MThd") throw new Error("not midi");
        var hlen = u32();
        u16();                       // 格式号，不关心
        var ntrk = u16();
        var div = u16();
        p += hlen - 6;
        if (div & 0x8000) throw new Error("smpte");   // 不支持 SMPTE 时基
        var evs = [], tempos = [];
        while (ntrk-- > 0) {
          if (str4() !== "MTrk") throw new Error("bad track");
          var tlen = u32(), end = p + tlen;
          var tick = 0, run = 0;
          while (p < end) {
            tick += vlq();
            var st = u8();
            if (st < 0x80) { p--; st = run; } else run = st;   // 运行状态
            if (st === 0xff) {
              var type = u8(), mlen = vlq();
              if (type === 0x51 && mlen === 3) {
                tempos.push({ t: tick, us: (u8() << 16) | (u8() << 8) | u8() });
              } else p += mlen;
            } else if (st === 0xf0 || st === 0xf7) {
              p += vlq();
            } else {
              var cmd = st & 0xf0;
              if (cmd === 0x90 || cmd === 0x80) {
                var note = u8(), vel = u8();
                evs.push({ n: note, t: tick, v: vel, ch: st & 0x0f, on: cmd === 0x90 && vel > 0 });
              } else if (cmd === 0xc0 || cmd === 0xd0) { u8(); }
              else { u8(); u8(); }
            }
          }
          p = end;
        }
        /* tick → 秒：按 tempo 变化分段折算 */
        var tp = tempos.slice().sort(function (a, b) { return a.t - b.t; });
        if (!tp.length || tp[0].t > 0) tp.unshift({ t: 0, us: 500000 });
        function tickToSec(tick) {
          var sec = 0, pt = 0, us = 500000;
          for (var i = 0; i < tp.length && tp[i].t <= tick; i++) {
            sec += (tp[i].t - pt) * us / div / 1000000;
            pt = tp[i].t; us = tp[i].us;
          }
          return sec + (tick - pt) * us / div / 1000000;
        }
        /* 配对 note-on/off → 音符列表 */
        evs.sort(function (a, b) { return a.t - b.t; });
        var open = {}, out = [];
        evs.forEach(function (e) {
          var key = e.ch + ":" + e.n;
          if (e.on) {
            open[key] = { n: e.n, t0: tickToSec(e.t), v: e.v, ch: e.ch };
          } else if (open[key]) {
            var o = open[key];
            o.dur = tickToSec(e.t) - o.t0;
            if (o.dur > 0.03) out.push(o);
            delete open[key];
          }
        });
        out.sort(function (a, b) { return a.t0 - b.t0; });
        return out;
      }

      /* 把音符列表排程到 WebAudio：三角波主旋律 + 鼓组通道跳过 */
      function playMidiNotes(notes) {
        if (!ac || muted || !notes.length) return 0;
        if (notes.length > 1500) notes = notes.slice(0, 1500);
        var t0 = ac.currentTime + 0.25, end = t0;
        notes.forEach(function (o) {
          if (o.ch === 9) return;                    // 打击乐通道不发声
          var f = 440 * Math.pow(2, (o.n - 69) / 12);
          var v = Math.min(0.15, (o.v || 80) / 127 * 0.16);
          var g = ac.createGain();
          g.gain.setValueAtTime(0, t0 + o.t0);
          g.gain.linearRampToValueAtTime(v, t0 + o.t0 + 0.012);
          g.gain.setValueAtTime(v * 0.75, t0 + o.t0 + Math.max(0.03, o.dur - 0.06));
          g.gain.linearRampToValueAtTime(0, t0 + o.t0 + o.dur);
          var osc = ac.createOscillator();
          osc.type = "triangle";
          osc.frequency.value = f;
          osc.connect(g); g.connect(master);
          osc.start(t0 + o.t0); osc.stop(t0 + o.t0 + o.dur + 0.03);
          trackSfx(osc);
          if (t0 + o.t0 + o.dur > end) end = t0 + o.t0 + o.dur;
        });
        return (end - ac.currentTime) * 1000;
      }

      /* DEFRAG：经典簇块整理动画——把零散数据块搬到前面拼成连续区 */
      async function dosDefrag() {
        var COLS = 36, ROWS = 9, TOTAL = COLS * ROWS;
        await type("Microsoft Defrag · 优化 C: 盘", "amb");
        await type("正在读取簇分配表 ...", "dim");
        var used = [];
        for (var i = 0; i < TOTAL; i++) used[i] = Math.random() < 0.6;
        var p = print("", "cyn");
        var step = 0;
        await new Promise(function (done) {
          var iv = setInterval(function () {
            if (leaving) { clearInterval(iv); done(); return; }
            /* 每轮交换两个簇：前面最靠前的空簇 ← 后面最靠后的数据簇 */
            for (var k = 0; k < 2; k++) {
              var firstFree = used.indexOf(false);
              if (firstFree === -1) break;
              var lastUsed = -1;
              for (var j = TOTAL - 1; j > firstFree; j--) {
                if (used[j]) { lastUsed = j; break; }
              }
              if (lastUsed === -1) break;
              used[firstFree] = true;
              used[lastUsed] = false;
            }
            var s = "";
            for (var r = 0; r < ROWS; r++) {
              for (var c = 0; c < COLS; c++) s += used[r * COLS + c] ? "█" : "·";
              s += "\n";
            }
            p.textContent = s;
            scrollBottom();
            if (step++ % 9 === 0) click();
            if (used.lastIndexOf(true) < used.indexOf(false)) {
              clearInterval(iv);
              done();
            }
          }, 35);
        });
        await type("优化完成：数据已连续存放，磁盘性能提升约 23%（心理作用）", "cyn");
        print("");
      }

      /* SCANDISK：磁头逐簇扫描动画，半路发现并修复一处交叉链接簇 */

            print("");

          print("");

          print("回形针中文版 · UCDOS 内核 · 1997", "dim");
          print("");

          await renderLines(dosMem(), true);

          var d = new Date();
          print("当前日期: " + (d.getMonth() + 1) + "-" + d.getDate() + "-" + d.getFullYear() +
            "    当前时间: " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2));
          print("");
        } else if (cmd === "cls" || cmd === "clear") {
          screen.innerHTML = "";
        } else if (cmd === "win" || cmd === "windows") {
          /* win：假装启动 Win95，然后被内存管理器劝退 */
          await type("This program cannot be run in DOS mode.", "err");
          print("");
        } else if (cmd === "vol") {
          print(" Volume in drive C is PAPERCLIP");

          print("");

          exitRetro();

          await type("警告：C: 盘上所有数据将会丢失!", "err");
          await type("是否继续 (Y/N)? N", "");

          print("");

          /* ping：查询 Minecraft 服务器实时状态（联网） */
          var host = cmd.slice(4).trim() || MC_HOST;
          await type("正在 Ping " + host + " [33.6.199.7] 具有 32 字节的数据:", "dim");
          if (host.indexOf(MC_HOST) !== -1) {
            try {
              var st = await fetchMcStatus();
              if (st.status === "online") {
                print("来自 " + MC_HOST + " 的回复: 字节=32 时间=1997ms TTL=97", "cyn");
                print("服务器状态: 在线 · " + (st.version || "未知版本"), "");
                print("在线玩家: " + ((st.players && st.players.online) != null ? st.players.online : "?") +
                  " / " + ((st.players && st.players.max) != null ? st.players.max : "?"), "");
                var mtxt = (typeof st.pureMotd === "string" && st.pureMotd) || mcMotdText(st.motd);
                if (mtxt) print("MOTD: " + mtxt.replace(/\n+/g, " "), "dim");
              } else {

              }
            } catch (e2) {

              print("");
            }
          } else {
            await type("Ping 请求超时。", "err");
            print("");
          }
        } else {
          /* 不是内部命令 → 尝试当作可执行文件运行：
             先查当前目录，再按 AUTOEXEC 里的 PATH 查 C:\DOS、C:\BBS */
          var tok = cmd.split(/\s+/)[0];
          var exe = findEntry(tok) || (function () {
            var pathDirs = ["C:\\DOS", "C:\\BBS"];
            for (var pi = 0; pi < pathDirs.length; pi++) {
              var arr = DISK[pathDirs[pi]] || [];
              for (var xi = 0; xi < arr.length; xi++) {
                if (arr[xi].n.toLowerCase() === tok) return arr[xi];
              }
            }
            return null;
          })();
          var base = exe ? exe.n.toLowerCase() : "";

          if (!exe) {
            print("Bad command or file name", "err");
          } else if (/\.bat$/.test(base) && exe.c) {
            /* BAT：把每一行当命令回显执行 */
            await renderLines(exe.c.map(function (t) { return ["  " + t, ""]; }), true);
            print("");
          } else if (/\.mid$/.test(base)) {
            await playMidFile();
          } else if (base === "mouse.com") {
            await type("鼠标驱动程序已安装。", "dim");
            print("");
          } else if (base === "smartdrv.exe") {
            await type("磁盘高速缓存程序已装载 (2048KB)。", "dim");
            print("");
          } else if (base === "edit.com") {
            await type("EDIT 已被 SysOp 删除。查看文本请使用 TYPE。", "dim");
            print("");
          } else if (/\.exe$/.test(base) && base.indexOf("doom") === 0) {
            await type("程序太大，无法装入内存。", "err");
            print("");
          } else if (/\.exe$|\.com$/.test(base)) {
            await type("内存不足。", "err");
            print("");
          } else {
            print("Bad command or file name", "err");
          }
        }
      }

      async function dosLoop() {
        while (!leaving) {
          completer = dosCompleter;   // DOS 提示符下启用 Tab 补全（BBS 挂断返回后也恢复）
          var raw = await ask(cwdPath());
          if (leaving) return;        // exit 关机后立即收尾
          if (!raw) continue;
          await dosDispatch(raw);
        }
      }

            [["── Cave Johnson 在此。──────────────────", "amb"]].concat(
              CAVE_LINES.map(function (l) { return [l, l.charAt(0) === "\"" ? "" : "dim"]; })
            ).concat([["", "dim"]]),
            true
          );
        } else if (cmd === "glados") {
          await type(GLADOS_LINES[Math.floor(Math.random() * GLADOS_LINES.length)], "wht");
          print("");
        } else if (cmd === "science") {
          await type("（我被要求朗读。措辞不代表我的立场，但你会信。）", "dim");
          await type(SCIENCE_LINES[Math.floor(Math.random() * SCIENCE_LINES.length)], "cyn");
          print("");
        } else if (cmd === "turret") {
          await renderLines([
            ["  哨兵炮塔：喂？有人吗？", "cyn"],
            ["  ……", "dim"],
            ["  哨兵炮塔：你在那里吗？我看不到你——", "cyn"],
            ["  （远处传来一声枪响，然后是一声倒地的闷响）", "dim"],
            ["  炮塔已下线。", "err"],
            ["  （它们的歌声不错。可惜唱完就没电了。）", "dim"],
            ["", "dim"],
          ], true);
        } else {
          await type("未知指令。人格矩阵认为你该多读手册。", "err");
          print("");
        }
        return false;
      }

      async function runPortal() {
        completer = null;      // 光圈终端不吃 DOS 的 Tab 补全
        inDial = true;         // 启动动画可双击跳过
        dialDone = false;
        skipFlag = false;
        crt.classList.add("aperture");
        screen.innerHTML = "";
        sbSet("光圈科技 · 终端 v3.11");
        beep(660, 0.1, 0.045, "sine");

        await dialSleep(600);
        for (var ali = 0; ali < APERTURE_LOGO.length; ali++) {
          print(APERTURE_LOGO[ali][0], "art art-small wht");   // Logo White
          await dialSleep(APERTURE_LOGO[ali][1]);   // 老光盘读盘节奏，可双击跳过
        }
        await dialSleep(400);
        print("光 圈 科 技", "cn");
        APERTURE_FOOTER.forEach(function (r) { print(r[0], r[1]); });

        await dialSleep(400);
        print("正在接入光圈科技主机 ...... 网络通了。我也在。", "wht");
        await dialSleep(300);
        print("公司起源 ...... 浴帘。别问，问就是没意义", "dim");
        await dialSleep(240);
        print("你的位置 ...... 地下 4500 米。最底层的底层。如果你觉得冷，是心理作用", "dim");
        await dialSleep(240);
        print("我，GLaDOS ...... 我是一切。你的安全是我的次要功能", "dim");
        await dialSleep(260);
        print("神经毒素 ...... 库存充足。我并不是在暗示什么", "dim");
        await dialSleep(260);
        print("哨兵炮塔 ...... 它们很期待拥抱你。用子弹", "dim");
        await dialSleep(260);
        print("你的行踪 ...... 我始终知道。你连想躲的时候，我也知道", "dim");
        await dialSleep(260);
        print("蛋糕 ...... 没有。再说一遍：没有。再问就关你进测试间", "dim");
        await dialSleep(500);
        print("");

        inDial = false;
        dialDone = false;
        skipFlag = false;

        await type("你好。又——又见面了。你总是回来，我很佩服你的健忘。", "wht");
        await type("欢迎回到光圈科学计算机丰富学习中心", "wht");
        await type(" —— 这里唯一\"丰富\"的是你的待办测试列表。", "wht");
        print("");
        await type("所有人都盼着你来。他们只是没活到今天，真可惜。", "cyn");
        print("");
        await type("按规章告知：你在这里的每一天都是不可逆的，", "cyn");
        await type("就像我删掉的那个文件。", "cyn");
        await type("这不是威胁，是协议条款。你没读过，但我替你读过了。", "cyn");
        print("");
        await type("输入 help。这不是建议，是让终端有事可做。", "dim");
        print("");

        var back = false;
        while (!leaving && !back) {
          var raw = await ask("APERTURE> ");
          if (leaving) break;
          if (!raw) continue;
          back = await portalDispatch(raw);
          if (back) {
            await type("正在断开人格矩阵 …… 你随时可以走。这是假的。", "dim");
            await type("你听得出来我在开玩笑，对吧？不，你听不出来。", "dim");
            await sleep(500);
          }
        }

        /* 离开光圈终端：面板收缩动画（0.7s）结束后恢复 DOS 外壳与配色 */
        crt.classList.add("portal-out");
        await sleep(700);
        crt.classList.remove("aperture", "portal-out");
        sbSet("PaperClip DOS v6.22");
        print("");
      }

      /* ---------------- 开机：POST 自检 + DOS 引导 ---------------- */
      async function bootSequence() {
        power.remove();
        crt.classList.add("booting");
        inDial = true;
        statusbar.classList.add("on");
        sbSet("PaperClip DOS v6.22");

        /* POST 蜂鸣：经典的一声短开机音 */
        beep(880, 0.12, 0.05, "square");
        loadSiteData();   // 后台抓取主页真实数据（时间线/技能/版本/曲单），不打断开机动画
        await dialSleep(650);
        print("PaperClip BIOS v1.03  (C) 1997 Clip Software Lab.", "dim");
        print("");
        print("Main Processor : 486DX2-66");
        await dialSleep(280);
        print("Memory Test    : 8192KB OK");
        await dialSleep(450);
        print("");
        await dialSleep(450);
        print("Starting PaperClip DOS ...", "wht");
        await dialSleep(750);
        print("HIMEM: DOS XMS 驱动程序 3.10 已安装。", "dim");
        await dialSleep(260);
        print("磁盘高速缓存程序 SMARTDRV 已装载。", "dim");
        await dialSleep(260);
        print("CD-ROM 扩展程序 MSCDEX 2.23 已装载。", "dim");
        await dialSleep(260);
        print("调制解调器驱动已就绪 (COM2, IRQ3)。", "dim");
        await dialSleep(260);
        print("UCDOS 5.0 中文平台已加载。", "dim");
        await dialSleep(550);
        print("");

        /* 引导动画结束，进入 DOS 命令行 */
        inDial = false;
        dialDone = false;
        skipFlag = false;

        await type("键入 help 可以查看命令列表。", "cyn");
        print("");
        await dosLoop();
      }

      /* 老用户提示逻辑已并入登录流程（见 runBBS 登录段） */

      /* 拨号阶段跳过：双击屏幕 → 补完打印、停掉已排期音效并加速所有等待 */
      crt.addEventListener("dblclick", function () {
        if (inDial && !dialDone) {
          dialDone = true;
          skipFlag = true;
          if (curJob) curJob.finish();
          stopAllSfx();
        }
      });

      power.addEventListener("click", function () {
        audioInit();
        bootSequence();
      });
      power.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); audioInit(); bootSequence(); }
      });
    })();
  </script>
